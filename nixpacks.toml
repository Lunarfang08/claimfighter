# Sevalla / Nixpacks build config for the FastAPI backend
[phases.setup]
nixPkgs = ["python311", "gcc", "tesseract", "leptonica"]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-eng"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && pip install -e .",
]

[start]
cmd = "cd backend && python -m uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8080}"
