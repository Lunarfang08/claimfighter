# fly.toml config file generated for backend API deployment.
# Deploy from repo root: fly deploy -c fly.backend.toml

app = 'medical-insu-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.backend'

[env]
  STORAGE_DIR = '/data/storage'
  UPLOADS_DIR = '/data/uploads'
  OLLAMA_BASE_URL = 'http://127.0.0.1:11434/v1'
  OLLAMA_MODEL = 'qwen2.5:3b'
  OLLAMA_MODELS = '/data/ollama/models'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '300s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2

[mounts]
  source = 'medical_insu_data'
  destination = '/data'
